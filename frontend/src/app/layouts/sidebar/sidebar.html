<p-drawer
  [visible]="true"
  [modal]="false"
  [showCloseIcon]="false"
  [dismissible]="false"
  appendTo="self"
  styleClass="sidebar-drawer"
>
  <div class="sidebar-wrapper">
    <div class="sidebar-top">
      <div class="logo">
        <div class="logo-box">
          <i class="pi pi-bolt"></i>
        </div>
        <span>TaskFlow</span>
      </div>
      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">
          <i class="pi pi-th-large nav-icon"></i>
          <span>{{ 'SIDEBAR.DASHBOARD' | translate }}</span>
        </a>
        <a routerLink="/tasks" routerLinkActive="active">
          <i class="pi pi-check-square nav-icon"></i>
          <span>{{ 'SIDEBAR.TASKS' | translate }}</span>
        </a>
        <a routerLink="/settings" routerLinkActive="active">
          <i class="pi pi-cog nav-icon"></i>
          <span>{{ 'SIDEBAR.SETTINGS' | translate }}</span>
        </a>
        <a routerLink="/connections" routerLinkActive="active">
          <i class="pi pi-user-plus nav-icon"></i>
          <span>{{ 'SIDEBAR.CONNECTIONS' | translate }}</span>
        </a>
        @if (isAdmin) {
          <a routerLink="/users" routerLinkActive="active">
            <i class="pi pi-user-edit nav-icon"></i>
            <span>{{ 'SIDEBAR.USERS' | translate }}</span>
          </a>
        }
      </nav>
    </div>
    @if (user) {
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">
            {{ getInitial(user.name) }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-email">{{ user.email }}</span>
          </div>
        </div>
      </div>
    }
    <p-button
      styleClass="sidebar-toggle-btn"
      (click)="toggleRequest.emit()"
      [title]="(isCollapsed ? 'SIDEBAR.EXPAND' : 'SIDEBAR.COLLAPSE') | translate"
    >
      <i
        class="pi"
        [class.pi-chevron-right]="isCollapsed"
        [class.pi-chevron-left]="!isCollapsed"
      ></i>
    </p-button>
  </div>
</p-drawer>
