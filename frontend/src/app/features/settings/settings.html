<div class="settings-container">
  <div class="settings-card">
    <div class="card-header">
      <div class="header-icon"><i class="ph-light ph-gear"></i></div>
      <h2>Account Settings</h2>
    </div>
    <form [formGroup]="profileForm" (ngSubmit)="onSaveProfile()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <div class="date-input-wrapper">
          <input type="date" formControlName="dateOfBirth">
        </div>
      </div>
      <div class="form-group">
        <button type="button" class="btn-change-password" (click)="openPasswordModal()">
          <i class="ph-light ph-lock"></i> Change Password
        </button>
      </div>
      <button type="submit" class="btn-save">Save Changes</button>
    </form>
  </div>
  <div class="modal-overlay" *ngIf="showPasswordModal" (click)="closePasswordModal()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="card-header">
        <div class="header-icon"><i class="ph-light ph-lock"></i></div>
        <h2>Change Password</h2>
      </div>
      <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" formControlName="currentPassword" placeholder="Enter current password">
          <small class="error-msg" *ngIf="passwordForm.get('currentPassword')?.touched && passwordForm.get('currentPassword')?.invalid">
            Please enter current password.
          </small>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" formControlName="newPassword" placeholder="At least 6 characters">
          <small class="error-msg" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
            New password must be at least 6 characters.
          </small>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirm your new password">
          <small class="error-msg" *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.get('confirmPassword')?.invalid">
            Please confirm your new password.
          </small>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closePasswordModal()">Cancel</button>
          <button type="submit" class="btn-confirm">Confirm Change Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
