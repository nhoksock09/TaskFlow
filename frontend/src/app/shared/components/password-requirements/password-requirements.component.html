<ul class="requirements-grid">
  @for (req of requirements; track req.id) {
    <li class="requirement-pill" [class.met]="req.test(value)">
      @if (req.test(value)) {
        <svg
          class="icon check"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
        >
          <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      } @else {
        <svg
          class="icon cross"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
        >
          <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
      <span>{{ req.label | translate }}</span>
    </li>
  }
</ul>
